<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">How a WebAudit AI audit works</title>
<desc id="d">Four steps: Discover pages from robots.txt, sitemaps and links; Inspect with HTTP checks on every page and a real browser on sampled templates; Prioritise by grouping issues by template and ranking them; Report with evidence for every finding. Optional AI can explain results but never changes findings.</desc>
<rect width="1200" height="300" rx="16" fill="#0B1220"/>
<path d="M32 30 l6 6 -6 6 -6 -6z" fill="#5CE0BE"/>
<text x="46" y="41" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#5CE0BE">HOW AN AUDIT WORKS</text>
<g>
  <rect x="32" y="56" width="252" height="144" rx="12" fill="#111A29" stroke="#344660"/>
  <circle cx="64" cy="90" r="14" fill="none" stroke="#5CE0BE" stroke-width="2"/>
  <text x="64" y="95" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#5CE0BE">1</text>
  <text x="88" y="96" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#F2F6FD">Discover</text>
  <text x="52" y="140" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">robots.txt · sitemaps · links</text>
  <text x="52" y="164" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">every URL gets a recorded state</text>
  <path d="M292 128 h20.666666666666664" stroke="#344660" stroke-width="2"/><path d="M312.6666666666667 122 l8 6 -8 6" fill="none" stroke="#344660" stroke-width="2"/>
</g>
<g>
  <rect x="326.6666666666667" y="56" width="252" height="144" rx="12" fill="#111A29" stroke="#344660"/>
  <circle cx="358.6666666666667" cy="90" r="14" fill="none" stroke="#5CE0BE" stroke-width="2"/>
  <text x="358.6666666666667" y="95" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#5CE0BE">2</text>
  <text x="382.6666666666667" y="96" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#F2F6FD">Inspect</text>
  <text x="346.6666666666667" y="140" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">HTTP checks on every page</text>
  <text x="346.6666666666667" y="164" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">real browser on sampled templates</text>
  <path d="M586.6666666666667 128 h20.666666666666664" stroke="#344660" stroke-width="2"/><path d="M607.3333333333334 122 l8 6 -8 6" fill="none" stroke="#344660" stroke-width="2"/>
</g>
<g>
  <rect x="621.3333333333334" y="56" width="252" height="144" rx="12" fill="#111A29" stroke="#344660"/>
  <circle cx="653.3333333333334" cy="90" r="14" fill="none" stroke="#5CE0BE" stroke-width="2"/>
  <text x="653.3333333333334" y="95" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#5CE0BE">3</text>
  <text x="677.3333333333334" y="96" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#F2F6FD">Prioritise</text>
  <text x="641.3333333333334" y="140" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">group by template</text>
  <text x="641.3333333333334" y="164" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">rank with a transparent index</text>
  <path d="M881.3333333333334 128 h20.666666666666664" stroke="#344660" stroke-width="2"/><path d="M902 122 l8 6 -8 6" fill="none" stroke="#344660" stroke-width="2"/>
</g>
<g>
  <rect x="916" y="56" width="252" height="144" rx="12" fill="#111A29" stroke="#344660"/>
  <circle cx="948" cy="90" r="14" fill="none" stroke="#5CE0BE" stroke-width="2"/>
  <text x="948" y="95" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#5CE0BE">4</text>
  <text x="972" y="96" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#F2F6FD">Report</text>
  <text x="936" y="140" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">evidence for every finding</text>
  <text x="936" y="164" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">HTML · CSV · JSON · Markdown</text>
  
</g>
<text x="32" y="250" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">Runs on your machine. Deterministic checks — the same audit gives the same findings.</text>
<text x="32" y="274" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9AABC2">Optional AI can explain the results and draft a roadmap; it never changes a finding.</text>
</svg>
